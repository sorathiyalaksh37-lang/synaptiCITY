<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#181b25;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)" rx="102.4"/>
  
  <!-- Neural network nodes -->
  <circle cx="128" cy="153.6" r="40.96" fill="url(#glow)" opacity="0.9"/>
  <circle cx="384" cy="153.6" r="40.96" fill="url(#glow)" opacity="0.9"/>
  <circle cx="256" cy="358.4" r="40.96" fill="url(#glow)" opacity="0.9"/>
  
  <!-- Connections -->
  <line x1="128" y1="153.6" x2="384" y2="153.6" 
        stroke="url(#glow)" stroke-width="10.24" opacity="0.6"/>
  <line x1="128" y1="153.6" x2="256" y2="358.4" 
        stroke="url(#glow)" stroke-width="10.24" opacity="0.6"/>
  <line x1="384" y1="153.6" x2="256" y2="358.4" 
        stroke="url(#glow)" stroke-width="10.24" opacity="0.6"/>
  
  <!-- Text (only on larger icons) -->
  
  <text x="256" y="460.8" 
        font-family="Space Grotesk, sans-serif" 
        font-size="40.96" 
        font-weight="700"
        fill="#38bdf8" 
        text-anchor="middle">synaptiCITY</text>
  
</svg>